<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모성 - 여성 생식기 및 임신 | CBT</title><style>
:root{--navy:#163a63;--blue:#1769aa;--green:#13875b;--red:#c43e3e;--line:#d7e0e8;--bg:#f3f6f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'NanumGothic','Malgun Gothic',Arial,sans-serif;color:#1f2d3a;line-height:1.65}header{background:var(--navy);color:#fff;padding:17px 24px}.head{max-width:900px;margin:auto;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-weight:800;font-size:18px}.sub{font-size:13px;opacity:.85}main{max-width:900px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;box-shadow:0 5px 18px #18324a0b}.hidden{display:none!important}h1{margin:0 0 11px;color:var(--navy);font-size:27px}.intro{color:#687684;margin:0 0 22px}.rule{background:#edf6fc;border-left:4px solid var(--blue);padding:14px 16px;border-radius:7px;margin:15px 0 25px;font-size:14px}.primary{border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:800;padding:13px 23px;cursor:pointer}.primary:hover{background:#10598f}.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#61707e;font-size:14px}.badge{font-weight:800;color:var(--navy)}.barbox{height:9px;background:#e3eaf0;border-radius:9px;overflow:hidden;margin:17px 0 5px}#bar{background:var(--green);height:100%;width:0;transition:.25s}.qno{color:var(--blue);font-size:14px;font-weight:800;margin-top:18px}#question{font-size:21px;font-weight:700;line-height:1.55;margin:8px 0 21px}.choice{display:flex;width:100%;gap:13px;align-items:flex-start;text-align:left;background:white;border:1.5px solid #cad7e2;border-radius:8px;padding:14px 16px;margin:10px 0;color:#1f2d3a;font:inherit;cursor:pointer}.choice:hover:not(:disabled){background:#f4f9fd;border-color:var(--blue)}.choice:disabled{cursor:default}.label{font-weight:900;color:var(--blue);min-width:20px}.correct{border-color:var(--green)!important;background:#eaf8f1!important;color:#075b39}.wrong{border-color:var(--red)!important;background:#fff0f0!important;color:#922b2b}.feedback{padding:14px 16px;margin:18px 0;border-radius:8px;font-weight:800}.ok{background:#eaf8f1;color:#075b39}.no{background:#fff0f0;color:#922b2b}#next{float:right}.foot{clear:both;padding-top:26px;color:#687684;font-size:12px}.big{font-size:42px;font-weight:900;color:var(--green);margin:7px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#f5f8fa;border-radius:8px;padding:13px;text-align:center;color:#687684;font-size:14px}.stat b{display:block;color:var(--navy);font-size:22px}@media(max-width:560px){main{margin:18px auto}.card{padding:21px 17px}.head{align-items:flex-start;flex-direction:column;gap:2px}h1{font-size:23px}#question{font-size:18px}.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="head"><div class="brand">국가고시 CBT 연습</div><div class="sub">정답 20개를 맞히면 자동 종료됩니다</div></div></header><main>
<section id="start" class="card"><h1>모성 - 여성 생식기 및 임신</h1><p class="intro">문제은행에서 무작위로 출제되는 CBT 연습입니다.</p><div class="rule"><b>진행 방법</b><br>답안을 선택하면 즉시 정답·오답과 정답 보기가 표시됩니다. <b>정답을 누적 20개 맞히면 자동 종료</b>됩니다.</div><button class="primary" onclick="startExam()">시험 시작</button></section>
<section id="exam" class="card hidden"><div class="status"><span id="ct" class="badge">정답 0 / 20</span><span id="nt">풀이 0문제</span><span id="timer">00:00</span></div><div class="barbox"><div id="bar"></div></div><div id="qno" class="qno"></div><div id="question"></div><div id="choices"></div><div id="feedback" class="hidden"></div><button id="next" class="primary hidden" onclick="nextQ()">다음 문제 →</button><div class="foot">문항은 중복 없이 무작위로 출제됩니다.</div></section>
<section id="result" class="card hidden"><h1>시험 종료</h1><p class="intro">정답 20개를 달성했습니다. 수고하셨습니다!</p><div class="big">20 / 20</div><div class="grid"><div class="stat"><b id="rt"></b>총 풀이</div><div class="stat"><b id="rw"></b>오답</div><div class="stat"><b id="rr"></b>정답률</div></div><p id="rtime" class="intro"></p><button class="primary" onclick="startExam()">새로 시작하기</button></section></main>
<script>const bank=[{"no": "001", "question": "태아의 성을 결정하는 염색체로 옳은 것은?", "choices": [{"label": "①", "text": "상염색체"}, {"label": "②", "text": "정자 성염색체"}, {"label": "③", "text": "난자 성염색체"}, {"label": "④", "text": "상동염색체"}, {"label": "⑤", "text": "황체호르몬"}], "answer": "②"}, {"no": "002", "question": "정자를 생성하는 장소와 정자가 완전히 성숙되는 장소가 바르게 연결된 것은?", "choices": [{"label": "①", "text": "정관 - 고환"}, {"label": "②", "text": "고환 - 부고환"}, {"label": "③", "text": "부고환 - 사정관"}, {"label": "④", "text": "전립선 - 정관"}, {"label": "⑤", "text": "전립선 - 사정관"}], "answer": "②"}, {"no": "003", "question": "정자의 수명은 질 내에서는 4~8시간이다. 자궁 내에서의 정자의 수명으로 옳은 것은?", "choices": [{"label": "①", "text": "4~8시간"}, {"label": "②", "text": "12시간"}, {"label": "③", "text": "24시간"}, {"label": "④", "text": "48시간"}, {"label": "⑤", "text": "72시간"}], "answer": "⑤"}, {"no": "004", "question": "배란을 알 수 있는 부인과적 임상적 증상으로 옳은 것은?", "choices": [{"label": "①", "text": "질내 pH가 저하된다."}, {"label": "②", "text": "경관점액의 점도가 증가한다."}, {"label": "③", "text": "기초체온이 지속적으로 하강한다."}, {"label": "④", "text": "현미경상 질 분비물이 양치식물 모양을 보인다."}, {"label": "⑤", "text": "경관점액량이 감소한다."}], "answer": "④"}, {"no": "005", "question": "배란 전에 자궁 내막을 증식시키는 호르몬으로 옳은 것은?", "choices": [{"label": "①", "text": "황체형성호르몬"}, {"label": "②", "text": "에스트로젠"}, {"label": "③", "text": "타이록신"}, {"label": "④", "text": "지방분해효소(리파아제)"}, {"label": "⑤", "text": "황체호르몬(프로제스테론)"}], "answer": "②"}, {"no": "006", "question": "배란 후 2주일경에 월경이 일어나는 이유로 옳은 것은?", "choices": [{"label": "①", "text": "황체형성호르몬의 분비 촉진"}, {"label": "②", "text": "난포자극호르몬의 분비 증가"}, {"label": "③", "text": "에스트로젠과 황체호르몬의 감소"}, {"label": "④", "text": "에스트리올의 감소"}, {"label": "⑤", "text": "에스트로젠의 분비 증가"}], "answer": "③"}, {"no": "007", "question": "질 점액을 엄지와 검지로 늘려보았을 때 12cm까지 늘어나는 것을 볼 수 있었다. 이때는 여성 자궁의 어느 시기인가?", "choices": [{"label": "①", "text": "월경기"}, {"label": "②", "text": "분비기"}, {"label": "③", "text": "배란기"}, {"label": "④", "text": "황체기"}, {"label": "⑤", "text": "증식기"}], "answer": "③"}, {"no": "008", "question": " 047", "question": "여성호르몬 중 하나이고 사춘기에 왕성하게 분비되는 특징을 가진 난포호르몬(에스트로젠)의 기능으로 옳은 것은?", "choices": [{"label": "①", "text": "유즙이 생성되도록 젖샘 발달을 촉진한다."}, {"label": "②", "text": "태반의 착상을 돕는다."}, {"label": "③", "text": "임신이 되면 더 이상 배란이 되지 않도록 한다."}, {"label": "④", "text": "자궁 속막의 환경을 조절한다."}, {"label": "⑤", "text": "여성의 성기를 발육시킨다."}], "answer": "⑤"}, {"no": "048", "question": "배란 후 분비되는 호르몬으로 임신 시 자궁 내막 유지, 자궁수축력 감소, 조산 예방, 수정란 착상 준비, 임신 시 배란 억제의 기능을 가지고 있는 것은?", "choices": [{"label": "①", "text": "알도스테론(Aldosterone)"}, {"label": "②", "text": "테스토스테론(Testosterone)"}, {"label": "③", "text": "에스트로젠(Estrogen)"}, {"label": "④", "text": "황체호르몬(Progesterone)"}, {"label": "⑤", "text": "프로락틴(Prolactine)"}], "answer": "④"}, {"no": "049", "question": "'임신 중 이상적인 체중 증가는 ( )이므로 임신 중 지나친 체중 증가가 되지 않도록 관찰해야 한다.'에서 빈 칸에 들어갈 말은?", "choices": [{"label": "①", "text": "6kg"}, {"label": "②", "text": "11kg"}, {"label": "③", "text": "16kg"}, {"label": "④", "text": "18kg"}, {"label": "⑤", "text": "20kg"}], "answer": "②"}, {"no": "050", "question": "임신 중기에서 말기까지의 체중 증가로 옳은 것은?", "choices": [{"label": "①", "text": "100~150g/주"}, {"label": "②", "text": "200~250g/주"}, {"label": "③", "text": "400~450g/주"}, {"label": "④", "text": "700~750g/주"}, {"label": "⑤", "text": "900~1,000g/주"}], "answer": "③"}, {"no": "051", "question": "태아 출현과 관련이 있는 임신의 확정적 징후로 옳은 것은?", "choices": [{"label": "①", "text": "복부 증대, 태동"}, {"label": "②", "text": "임신반응 양성, 입덧"}, {"label": "③", "text": "태아심음 청취, 태동"}, {"label": "④", "text": "입덧, 구토"}, {"label": "⑤", "text": "월경 중지, 체중 감소"}], "answer": "③"}, {"no": "052", "question": "정확한 분만예정일을 계산하기 위해 반드시 알아야 하는 사항은 무엇인가?", "choices": [{"label": "①", "text": "마지막 월경 시작일"}, {"label": "②", "text": "마지막 월경 종료일"}, {"label": "③", "text": "마지막 월경 중간일"}, {"label": "④", "text": "처음으로 산전 진찰을 받은 날"}, {"label": "⑤", "text": "처음 입덧을 한 날"}], "answer": "①"}, {"no": "053", "question": "둘째 아이를 임신한 가정주부 A씨의 최종월경일이 2024년 5월 20일이었다. 분만예정일은 언제인가?", "choices": [{"label": "①", "text": "2025년 1월 27일"}, {"label": "②", "text": "2025년 2월 27일"}, {"label": "③", "text": "2025년 3월 27일"}, {"label": "④", "text": "2025년 4월 29일"}, {"label": "⑤", "text": "2025년 5월 29일"}], "answer": "②"}];let order=[],i=0,correct=0,total=0,wrong=0,startAt,timer,answered=false;const target=20;function mix(a){for(let k=a.length-1;k;k--){let j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}function time(x){return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function tick(){document.querySelector('#timer').textContent=time(Math.floor((Date.now()-startAt)/1000))}function startExam(){order=mix([...bank]);i=correct=total=wrong=0;startAt=Date.now();clearInterval(timer);timer=setInterval(tick,1000);document.querySelector('#start').classList.add('hidden');document.querySelector('#result').classList.add('hidden');document.querySelector('#exam').classList.remove('hidden');render()}function stat(){ct.textContent=`정답 ${correct} / ${target}`;nt.textContent=`풀이 ${total}문제`;bar.style.width=(correct/target*100)+'%';tick()}function render(){answered=false;if(i>=order.length){order=mix([...bank]);i=0}let q=order[i];qno.textContent='문제 '+q.no;question.textContent=q.question;choices.innerHTML=q.choices.map(c=>`<button class="choice" data-x="${c.label}" onclick="answer('${c.label}')"><span class="label">${c.label}</span><span>${c.text}</span></button>`).join('');feedback.className='hidden';next.classList.add('hidden');stat()}function answer(x){if(answered)return;answered=true;let q=order[i],ok=x===q.answer;total++;ok?correct++:wrong++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.x===q.answer)b.classList.add('correct');if(!ok&&b.dataset.x===x)b.classList.add('wrong')});feedback.className='feedback '+(ok?'ok':'no');feedback.textContent=ok?'정답입니다.':'오답입니다. 정답은 '+q.answer+'입니다.';stat();next.onclick=correct>=target?finish:nextQ;next.textContent=correct>=target?'결과 보기 →':'다음 문제 →';next.classList.remove('hidden')}function nextQ(){i++;render()}function finish(){clearInterval(timer);let el=Math.floor((Date.now()-startAt)/1000);exam.classList.add('hidden');result.classList.remove('hidden');rt.textContent=total+'문제';rw.textContent=wrong+'문제';rr.textContent=Math.round(correct/total*100)+'%';rtime.textContent='소요 시간: '+time(el)}</script></body></html>
